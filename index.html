<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSHI MATCH</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff8fb;
      color: #39313a;
    }
    header {
      padding: 22px 16px;
      background: white;
      border-bottom: 1px solid #f2dce7;
      text-align: center;
    }
    h1 {
      margin: 0;
      color: #e879a9;
      letter-spacing: 2px;
    }
    main {
      padding: 24px 18px;
      text-align: center;
    }
    .card {
      margin: 24px auto;
      padding: 24px 16px;
      max-width: 320px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px #e8cbd833;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 24px;
      background: #e879a9;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>OSHI MATCH ♡</h1>
    <p>今日、新しい出会いがあるかも。</p>
  </header>
  <main>
    <div class="card">
      <h2>あなたの推しに、出会おう。</h2>
      <p>運命のマッチング、始まります。</p>
      <button onclick="alert('推しとの出会いは、これから！')">
        はじめる ♡
      </button>
    </div>
    <p>あなたのための特別なマッチングアプリ</p>
  </main>
</body>
</html>
