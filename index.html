
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSHI MATCH ♡</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fff6fa;
  color: #493744;
}
header {
  background: white;
  padding: 18px 12px;
  text-align: center;
  border-bottom: 1px solid #f5dce8;
  position: sticky;
  top: 0;
}
header h1 {
  color: #e875a5;
  font-size: 23px;
  letter-spacing: 2px;
  margin: 0;
}
header p { margin: 5px 0 0; font-size: 12px; }
main { max-width: 440px; margin: auto; padding: 20px 16px 40px; }
.card {
  background: white;
  border-radius: 24px;
  padding: 24px 18px;
  margin: 14px 0;
  text-align: center;
  box-shadow: 0 5px 20px #dca7c522;
}
.hero { padding: 35px 18px; margin-top: 30px; }
.heart { font-size: 55px; margin: 10px; }
h2 { font-size: 23px; margin: 12px 0; }
.name { font-size: 25px; font-weight: bold; margin: 12px 0; }
.tag {
  display: inlineら-block;
  background: #fff0f6;
  color: #c45383;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  margin: 4px;
}
.desc { line-height: 1.9; font-size: 14px; }
button {
  border: none;
  border-radius: 28px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
}
.primary { background: #e875a5; color: white; }
.secondary { background: #fff0f6; color: #b84d7d; }
button:active { transform: scale(.97); }
.actions { display: flex; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.small { font-size: 12px; color: #987f90; }
.hidden { display: none !important; }
.progress { color: #c66c93; font-size: 13px; }
footer { text-align: center; color: #b29baa; font-size: 11px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>OSHI MATCH ♡</h1>
  <p>今日、新しい出会いがあるかも。</p>
</header>

<main>
  <section id="home" class="card hero">
    <div class="heart">💗</div>
    <h2>あなたの推しに、出会おう。</h2>
    <p class="desc">たくさんの出会いの中に、<br>運命の人がいるかもしれない。</p>
    <button class="primary" onclick="startApp()">はじめる ♡</button>
    <p class="small">あなたのための特別なマッチングアプリ</p>
<div class="card">
  <h3>💌 届いたLIKE</h3>
  <p>新しいLIKEが届くかも…♡</p>
  <button class="primary" onclick="showLikes()">LIKEを見る ♡</button>
</div>
  </section>

  <section id="discover" class="hidden">
    <p class="progress" id="progress"></p>
    <div class="card">
      <div class="heart">♡</div>
      <div class="name" id="name"></div>
      <p class="desc" id="desc"></p>
      <p class="small" id="hobby"></p>
      <p class="small">プロフィールを見て、気になったらいいねしてね。</p>
      <div class="actions">
        <button class="secondary" onclick="nextProfile()">次の人へ →</button>
        <button class="primary" onclick="likeProfile()">いいね ♡</button>
      </div>
    </div>
    <div class="card">
      <p>💌 気になる人を探してみよう</p>
      <button class="secondary" onclick="showHome()">ホームへ戻る</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <div class="heart">💞</div>
    <h2 id="resultTitle">マッチしました！</h2>
    <p class="desc" id="resultDesc"></p>
    <button class="primary" onclick="backToDiscover()">推し探しを続ける ♡</button>
　　<button id="dmButton" class="primary hidden" onclick="openDM()">♡DMする♡</button>
    <button class="secondary" onclick="showHome()">ホームへ</button>
  </section>

<!-- DM画面 -->
<section id="dm" class="card hidden">
  <h2 id="dmTitle">💌 メッセージ</h2>
  <div id="dmMessages">
    <p>相手からのメッセージが届くよ♡</p>
  </div>

  <div id="dmChoices">
    <p>なんて返信する？</p>
    <button class="primary" onclick="replyDM(0)">よろしくね♡</button>
    <button class="primary" onclick="replyDM(1)">会えて嬉しい！</button>
    <button class="primary" onclick="replyDM(2)">どんな人なの？</button>
  </div>

  <button class="secondary" onclick="backToDiscover()">戻る</button>
</section>
  
<section id="likesScreen" class="hidden">
  <div class="card">
    <h2>💌 届いたLIKE</h2>
    <p class="desc">あなたにLIKEを送ってくれた人たち♡</p>
    <div id="likesList"></div>
    <button class="secondary" onclick="showHome()">ホームへ戻る</button>
  </div>
</section>

</main>

<footer>OSHI MATCH ♡ made with love</footer>

  },

    tag:"いたずら好き",
    desc:"やあ！退屈な毎日とはおさらばしたいと思わないかい？笑いの絶えない時間なら僕に任せてよ！面白いことを見つけるのは得意なんだ。",

  {

    desc:"黒崎蘭丸だ。細かいことは気にしない。回りくどいのも好きじゃない。好きなものにはとことん本気で向き合う。中途半端な付き合いをするつもりはない。よろしく頼む。",
    hobby:"昼寝・ベース"
  },
  {
    name:"風真玲太",
    tag:"誰にでも優しい人気者",
    desc:"風真玲太です。人と話すことが好きで、相手に喜んでもらえることを考えるのも好きです。気軽に話せる関係から、少しずつお互いを知っていけたら嬉しいです。よろしくお願いします。",
    hobby:"雑貨・人に似合うものを選ぶこと・接客"
  },
  {
    name:"トラファルガー・ロー",
    tag:"落ち着いた関係を",
    desc:"トラファルガー・ローだ。医者をしている。大勢で騒ぐより、落ち着いて話せる方が性に合ってる。気が合うかどうかは、話してみてから判断させてもらう。",
    hobby:"医術・外科手術"
  }
];

let current = 0;
let liked = new Set();

function hideAll() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("discover").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
document.getElementById("dm").classList.add("hidden");
document.getElementById("likesScreen").classList.add("hidden");
}
function startApp() {
  current = 0;
  hideAll();
  document.getElementById("discover").classList.remove("hidden");
  renderProfile();
}

function renderProfile() {
  const p = profiles[current];

  document.getElementById("progress").textContent =
    "PROFILE " + (current + 1) + " / " + profiles.length;

  document.getElementById("name").textContent = p.name;

  document.getElementById("desc").textContent = p.desc;

  document.getElementById("hobby").textContent =
    p.hobby ? "好きなもの・得意なこと：" + p.hobby : "";
}
function nextProfile() {
  current = (current + 1) % profiles.length;
  renderProfile();
}
function likeProfile() {
  const p = profiles[current];

  liked.add(p.name);

  hideAll();
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("resultTitle").textContent =
    "LIKEを送りました♡";

  document.getElementById("resultDesc").textContent =
    p.name + "にLIKEを送ったよ！お返事を待ってみよう♡";
  
  document.getElementById("dmButton").classList.add("hidden");
}
function backToDiscover() {
  hideAll();
  document.getElementById("discover").classList.remove("hidden");
  renderProfile();
}
function showHome() {
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}
  function openDM() {
  const p = profiles[current];

  hideAll();

  document.getElementById("dm").classList.remove("hidden");
  document.getElementById("dmTitle").textContent =
    "💌 " + p.name + " とのメッセージ";

  document.getElementById("dmMessages").innerHTML =
    "<p>💗 " + p.name + "：マッチありがとう！これからよろしくね。</p>";

  document.getElementById("dmChoices").style.display = "block";
}
  function replyDM(choice) {
  const p = profiles[current];

  const replies = [
    "こちらこそ！仲良くしてね♡",
    "えっ、嬉しいな。俺も会えてよかった！",
    "それはこれからゆっくり知ってもらおうかな。"
  ];

  const messages = document.getElementById("dmMessages");

  const choices = [
    "よろしくね♡",
    "会えて嬉しい！",
    "どんな人なの？"
  ];

  messages.innerHTML +=
    "<p>あなた：" + choices[choice] + "</p>";

  messages.innerHTML +=
    "<p>💗 " + p.name + "：" + replies[choice] + "</p>";

  document.getElementById("dmChoices").style.display = "none";
}
  function backToDiscover() {
  hideAll();
  document.getElementById("discover").classList.remove("hidden");
}


function showLikes() {
  const likeNames = [
    "五月雨空也",
    "風真玲太",
    "不破湊"
  ];

  hideAll();
  document.getElementById("likesScreen").classList.remove("hidden");

  const list = document.getElementById("likesList");
  list.innerHTML = "";

  likeNames.forEach(name => {
    const button = document.createElement("button");
    button.className = "primary";
    button.textContent = "💗 " + name;
    button.style.display = "block";
    button.style.width = "100%";
    button.style.marginBottom = "10px";
    button.onclick = () => viewLikedProfile(name);
    list.appendChild(button);
  });
}

function viewLikedProfile(name) {
  const person = profiles.find(p => p.name === name);

  if (!person) {
    alert("プロフィールが見つからないよ！");
    return;
  }

  alert(
    "💗 " + person.name + "\n\n" +
    person.desc + "\n\n" +
    "好きなもの・得意なこと：" + person.hobby
  );
} 
</script>
</body>
</html>
